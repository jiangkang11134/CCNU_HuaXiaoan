server {
    listen 80;
    server_name localhost;

    # Keep Nginx upload limit aligned with backend MAX_UPLOAD_SIZE_BYTES.
    client_max_body_size 100M;

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    location /api/ {
        # 【重要】必须用「变量 + resolver」写法，不能写 proxy_pass http://api:5050/api/。
        # 原因：nginx 对 proxy_pass 里的域名只在「启动时」解析一次并永久缓存该 IP，
        #       而 Docker 每次重建容器都会重新分配 IP。若 web 比 api 先启动
        #       （compose 创建顺序），缓存的旧 IP 会失效（旧 IP 可能已被 worker 占用），
        #       表现为首页 200 但所有 /api/* 返回 502 Connection refused。
        # 用变量后 nginx 不再启动期解析，改由 Docker 内嵌 DNS 每 valid 秒重解析一次。
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:5050;
        # 用 $request_uri 透传原始请求 URI（含查询串）。原配置 location /api/ 与
        # proxy_pass 的 /api/ 前缀替换是「恒等替换」，因此两者完全等价。
        proxy_pass $api_upstream$request_uri;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_http_version 1.1;

        # SSE/流式响应支持
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # 增加超时时间（上传和流式响应）
        proxy_read_timeout 600;
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
    }
}
